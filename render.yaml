services:
  - type: web
    name: aptino-rag-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: GROQ_API_KEY
        sync: false
